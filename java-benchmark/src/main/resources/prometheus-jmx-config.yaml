startDelaySeconds: 0
ssl: false
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  - pattern: "java.lang<type=OperatingSystem><>ProcessCpuLoad"
    name: "process_cpu_load"
    type: GAUGE
    help: "CPU load of the process"
  - pattern: "java.lang<type=Memory><>HeapMemoryUsage"
    name: "heap_memory_used"
    type: GAUGE
    help: "Heap memory used in bytes"
  - pattern: "java.lang<type=GarbageCollector><>(CollectionCount|CollectionTime)"
    name: "gc_$2"
    type: GAUGE
    help: "GC metrics"